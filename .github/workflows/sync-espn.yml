name: Sync ESPN Games

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What do you want to sync?'
        required: true
        type: choice
        options:
          - week
          - postseason
          - date
        default: week

      season:
        description: 'College football season'
        required: true
        default: '2026'

      value:
        description: 'ESPN week number for Week mode, or YYYYMMDD for Date mode. Leave blank for Postseason.'
        required: false
        default: '1'

jobs:
  sync:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync ESPN games to Firestore
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          SYNC_MODE: ${{ inputs.mode }}
          SYNC_SEASON: ${{ inputs.season }}
          SYNC_VALUE: ${{ inputs.value }}

        run: |
          if [ "$SYNC_MODE" = "week" ]; then
            node scripts/sync-espn.mjs week "$SYNC_SEASON" "$SYNC_VALUE"
          elif [ "$SYNC_MODE" = "postseason" ]; then
            node scripts/sync-espn.mjs postseason "$SYNC_SEASON"
          elif [ "$SYNC_MODE" = "date" ]; then
            node scripts/sync-espn.mjs date "$SYNC_VALUE"
          else
            echo "Unknown sync mode: $SYNC_MODE"
            exit 1
          fi