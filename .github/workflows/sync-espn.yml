name: Sync ESPN Games

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to import in YYYYMMDD format'
        required: true
        default: '20260829'

  # During the regular season:
  # - Every 5 minutes on Saturdays.
  # - Every 15 minutes during common Thu/Fri/Sun game windows.
  # The sync script exits without contacting ESPN when no published
  # game is within its live-update window.
  schedule:
    - cron: '*/5 * * * 6'
      timezone: 'America/New_York'

    - cron: '*/15 18-23 * * 4,5'
      timezone: 'America/New_York'

    - cron: '*/15 0-2 * * 5'
      timezone: 'America/New_York'

    - cron: '*/15 11-23 * * 0'
      timezone: 'America/New_York'

    - cron: '*/15 0-2 * * 1'
      timezone: 'America/New_York'

jobs:
  sync:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync ESPN games to Firestore
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/sync-espn.mjs "${{ inputs.date }}"
          else
            node scripts/sync-espn.mjs
          fi