name: Live Score Updates

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test weekly-results notification'
        required: true
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

      test_league_id:
        description: 'League ID for results test mode'
        required: false
        default: ''

      test_week_id:
        description: 'Week ID for results test mode'
        required: false
        default: ''

  schedule:
    # =========================================================
    # REGULAR SEASON — AUGUST THROUGH NOVEMBER
    # Times are UTC.
    #
    # Thursday evening through early Friday morning ET
    # Friday evening through early Saturday morning ET
    # Saturday late morning through early Sunday morning ET
    # =========================================================

    # Thursday: roughly 6 PM–midnight ET
    - cron: '*/5 22-23 * 8-11 4'
    - cron: '*/5 0-4 * 8-11 5'

    # Friday: roughly 6 PM–midnight ET
    - cron: '*/5 22-23 * 8-11 5'
    - cron: '*/5 0-4 * 8-11 6'

    # Saturday: roughly 11 AM ET through 2 AM ET Sunday
    - cron: '*/5 15-23 * 8-11 6'
    - cron: '*/5 0-7 * 8-11 0'

    # =========================================================
    # POSTSEASON — DECEMBER AND JANUARY
    #
    # Bowl / playoff games can happen nearly every day.
    # Run every 5 minutes from roughly 11 AM ET through
    # 2 AM ET the following morning.
    # =========================================================

    - cron: '*/5 16-23 * 12,1 *'
    - cron: '*/5 0-7 * 12,1 *'

jobs:
  sync:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Refresh published game scores
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}

        run: node scripts/sync-espn.mjs

      - name: Send completed-week results
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          TEST_MODE: ${{ inputs.test_mode || 'false' }}
          TEST_LEAGUE_ID: ${{ inputs.test_league_id || '' }}
          TEST_WEEK_ID: ${{ inputs.test_week_id || '' }}

        run: node scripts/send-week-results-notifications.mjs