name: Live Score Updates

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test weekly-results notification'
        required: true
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

      test_league_id:
        description: 'League ID for results test mode'
        required: false
        default: ''

      test_week_id:
        description: 'Week ID for results test mode'
        required: false
        default: ''

  schedule:
    # =========================================================
    # REGULAR SEASON — AUGUST THROUGH NOVEMBER
    #
    # Evening games can occur any day of the week.
    # Saturday also includes daytime games.
    #
    # timezone keeps these windows in Eastern Time
    # automatically across EDT / EST.
    # =========================================================

    # Every day: 6 PM through 2 AM ET
    - cron: '*/5 18-23 * 8-11 *'
      timezone: 'America/New_York'

    - cron: '*/5 0-2 * 8-11 *'
      timezone: 'America/New_York'

    # Saturday daytime: 11 AM through 5:59 PM ET
    - cron: '*/5 11-17 * 8-11 6'
      timezone: 'America/New_York'

    # =========================================================
    # POSTSEASON — DECEMBER AND JANUARY
    #
    # Bowl / playoff games can happen nearly every day.
    # Run every 5 minutes from 11 AM through 2 AM ET.
    # =========================================================

    - cron: '*/5 11-23 * 12,1 *'
      timezone: 'America/New_York'

    - cron: '*/5 0-2 * 12,1 *'
      timezone: 'America/New_York'

jobs:
  sync:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Refresh published game scores
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}

        run: node scripts/sync-espn.mjs

      - name: Send completed-week results
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          TEST_MODE: ${{ inputs.test_mode || 'false' }}
          TEST_LEAGUE_ID: ${{ inputs.test_league_id || '' }}
          TEST_WEEK_ID: ${{ inputs.test_week_id || '' }}

        run: node scripts/send-week-results-notifications.mjs