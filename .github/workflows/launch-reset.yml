name: Launch Reset

on:
  workflow_dispatch:
    inputs:
      execute:
        description: 'Actually delete launch-test data'
        required: true
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

jobs:
  reset:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Back up launch-test data
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}

        run: node scripts/backup-before-launch.mjs

      - name: Upload launch backup
        uses: actions/upload-artifact@v4
        with:
          name: pre-launch-firestore-backup
          path: app/launch-backup.json
          retention-days: 90

      - name: Launch reset
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}

        run: |
          if [ "${{ inputs.execute }}" = "true" ]; then
            node scripts/reset-for-launch.mjs --execute
          else
            node scripts/reset-for-launch.mjs
          fi
